# ╔══════════════════════════════════════════════════════════════════════╗
# ║  env/tmux.conf  —  Ghost Terminal Tmux Configuration                ║
# ║                                                                      ║
# ║  Loaded via: tmux -f /tmp/.ghost_*/tmux.conf                        ║
# ║  ~/.tmux.conf is NEVER touched.                                     ║
# ║  Prefix: Ctrl+A                                                     ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Prefix ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Terminal colours ──────────────────────────────────────────────────
set  -g default-terminal   "tmux-256color"
set  -ag terminal-overrides ",xterm-256color:RGB"
set  -g escape-time         0

# ── Mouse ─────────────────────────────────────────────────────────────
set -g mouse on

# ── Base index ────────────────────────────────────────────────────────
set  -g base-index      1
setw -g pane-base-index 1
set  -g renumber-windows on

# ── History ───────────────────────────────────────────────────────────
set -g history-limit 50000

# ── Activity ──────────────────────────────────────────────────────────
setw -g monitor-activity on
set  -g visual-activity  off

# ── Reload ────────────────────────────────────────────────────────────
bind r source-file "${GHOST_TMPDIR}/tmux.conf" \; \
       display "  Config reloaded"

# ── Splits ────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (vim-style) ───────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize ───────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation ─────────────────────────────────────────────────
bind -r Tab   next-window
bind -r S-Tab previous-window
bind -r C-h   previous-window
bind -r C-l   next-window

# ── New window preserves path ─────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"

# ── Copy mode (vi) ────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ════════════════════════════════════════════════════════════════════════
#  STATUS BAR  —  Tokyo Night palette
#  Colours:
#    #1a1b26 bg        #7aa2f7 blue      #9ece6a green
#    #f7768e red       #e0af68 yellow    #bb9af7 purple
#    #2ac3de cyan      #c0caf5 fg        #565f89 dim
#    #292e42 bg-hi
# ════════════════════════════════════════════════════════════════════════

set  -g status                on
set  -g status-position       bottom
set  -g status-interval       2
set  -g status-style          "bg=#1a1b26,fg=#c0caf5"

# Left: session name
set  -g status-left-length 40
set  -g status-left \
  "#[bg=#7aa2f7,fg=#1a1b26,bold]  #S #[bg=#1a1b26,fg=#7aa2f7]#[default] "

# Right: CPU · RAM · Load · Time
set  -g status-right-length 140
set  -g status-right \
  "#[bg=#292e42,fg=#9ece6a] 󰻠 #(grep 'cpu ' /proc/stat | awk '{u=\$2+\$4;t=\$2+\$3+\$4+\$5;if(p_t){printf \"%.0f%%\",100*(u-p_u)/(t-p_t)};p_u=u;p_t=t}' 2>/dev/null || echo '?') "\
  "#[bg=#292e42,fg=#7aa2f7] 󰍛 #(free -m 2>/dev/null | awk '/Mem/{printf \"%.0f%%\",\$3/\$2*100}') "\
  "#[bg=#1a1b26,fg=#292e42]"\
  "#[fg=#bb9af7,bg=#1a1b26]  #(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null) "\
  "#[fg=#1a1b26]#[bg=#7aa2f7,fg=#1a1b26,bold]  %H:%M  %d/%m "

# Window list
setw -g window-status-format         " #I #W "
setw -g window-status-current-format \
  "#[bg=#7aa2f7,fg=#1a1b26,bold] #I  #W #[bg=#1a1b26,fg=#7aa2f7]"
setw -g window-status-style          "fg=#565f89"

# Pane borders
set  -g pane-border-style        "fg=#292e42"
set  -g pane-active-border-style "fg=#7aa2f7"

# Message bar
set  -g message-style         "bg=#292e42,fg=#e0af68,bold"
set  -g message-command-style "bg=#292e42,fg=#f7768e"

# Clock
setw -g clock-mode-colour "#7aa2f7"
setw -g clock-mode-style  24

# ── Ghost dashboard shortcut ──────────────────────────────────────────
# prefix + G: launch ghost 3-pane layout in current session
bind G run-shell '\
  tmux rename-window "ghost" ; \
  tmux split-window -h -p 35 "btop 2>/dev/null || htop 2>/dev/null || top" ; \
  tmux select-pane -t 0 ; \
  tmux split-window -v -p 25 ; \
  tmux select-pane -t 0 ; \
  tmux send-keys -t 0 \
    "journalctl -f --no-pager 2>/dev/null || tail -f /var/log/syslog 2>/dev/null" \
    Enter ; \
  tmux select-pane -t 2'

# ── Misc ──────────────────────────────────────────────────────────────
set  -g focus-events on
setw -g aggressive-resize on
